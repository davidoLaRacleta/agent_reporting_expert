[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-agent"
version = "0.1.0"
description = "Console agent that generates and edits PowerPoint presentations via a pluggable LLM backend."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=0.6.23",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "openai>=1.30.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
ppt-agent = "ppt_agent.cli:main"

[tool.setuptools.packages.find]
include = ["ppt_agent*"]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
