[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-agent"
version = "0.1.0"
description = "Console agent that generates and edits PowerPoint presentations via a pluggable LLM backend."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=0.6.23",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "rich>=13.7.0",
    "langgraph>=0.6.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.2.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
ppt-agent = "ppt_agent.cli:main"

[tool.setuptools.packages.find]
include = ["ppt_agent*"]

[tool.pytest.ini_options]
filterwarnings = [
    # create_react_agent works unchanged today; see ppt_agent/agent/core.py for why
    # we stay on this langgraph-native import instead of adding `langchain` as a dep.
    "ignore::langgraph.warnings.LangGraphDeprecatedSinceV10",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
